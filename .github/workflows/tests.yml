name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install zig 0.16
        run: python -m pip install ziglang==0.16.0
      - name: Build native helpers
        run: python build_native.py
      - name: Run tests
        run: python -m unittest discover -v
